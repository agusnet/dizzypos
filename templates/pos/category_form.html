{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container py-3">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">

      <div class="card border-0 shadow-sm rounded-3">
        <div class="card-header bg-white border-bottom py-3">
          <div class="d-flex justify-content-between align-items-center">
            <h4 class="fw-bold mb-0">{{ title }}</h4>
            <a href="{% url 'category_list' %}" class="btn btn-outline-secondary btn-sm">
              <i class="bi bi-arrow-left me-1"></i> Volver a categorías
            </a>
          </div>
        </div>

        <div class="card-body p-4">
          <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
              <label class="form-label fw-semibold">Nombre de la categoría *</label>
              {{ form.name }}
              {% if form.name.errors %}<div class="text-danger small">{{ form.name.errors }}</div>{% endif %}
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Descripción</label>
              {{ form.description }}
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Imagen</label>
              {{ form.image }}
            </div>

            <hr class="my-4">

            <div class="d-flex justify-content-end gap-2">
              <a href="{% url 'category_list' %}" class="btn btn-light border px-4">Cancelar</a>
              <button type="submit" class="btn btn-primary px-4 fw-semibold">Guardar categoría</button>
            </div>

          </form>
        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
