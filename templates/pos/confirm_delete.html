{% extends 'base.html' %}

{% block title %}Eliminar {{ type }}{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">

      <div class="card border-0 shadow-sm rounded-3 text-center p-4">
        <div class="card-body">
          <div class="text-danger mb-3">
            <i class="bi bi-exclamation-triangle-fill fs-1"></i>
          </div>
          <h4 class="fw-bold mb-2">¿Eliminar {{ type }}?</h4>
          <p class="text-muted mb-4">
            Estás a punto de eliminar <strong>"{{ object }}"</strong>. Esta acción no se puede deshacer.
          </p>

          <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-2">
              <a href="{% url cancel_url %}" class="btn btn-light border px-4">Cancelar</a>
              <button type="submit" class="btn btn-danger px-4 fw-semibold">Sí, eliminar</button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
