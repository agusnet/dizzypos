{% if messages %}
<div class="container mt-3">
  {% for message in messages %}
  <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show shadow-sm border-0 rounded-3 alert-auto-dismiss d-flex align-items-center" role="alert">
    <div class="me-2 fs-5">
      {% if message.tags == 'success' %}
        <i class="bi bi-check-circle-fill text-success"></i>
      {% elif message.tags == 'danger' or message.tags == 'error' %}
        <i class="bi bi-exclamation-octagon-fill text-danger"></i>
      {% elif message.tags == 'warning' %}
        <i class="bi bi-exclamation-triangle-fill text-warning"></i>
      {% else %}
        <i class="bi bi-info-circle-fill text-info"></i>
      {% endif %}
    </div>
    <div class="flex-grow-1">
      {{ message }}
    </div>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
  </div>
  {% endfor %}
</div>
{% endif %}
